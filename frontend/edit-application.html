<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Application - JobTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
<nav class="navbar bg-white border-bottom"><div class="container"><a class="navbar-brand fw-bold text-primary" href="dashboard.html">JobTrack</a><a href="dashboard.html" class="btn btn-outline-secondary btn-sm">Back</a></div></nav>
<main class="container py-4"><div class="row justify-content-center"><div class="col-lg-9">
<div class="card border-0 shadow-sm"><div class="card-body p-4"><h2 class="fw-bold">Edit Application</h2><p class="text-secondary">Update your application details.</p><div id="alertBox"></div>
<form id="editApplicationForm">
<div class="row g-3">
<div class="col-md-6"><label class="form-label">Company Name *</label><input id="company" class="form-control" required></div>
<div class="col-md-6"><label class="form-label">Job Position *</label><input id="position" class="form-control" required></div>
<div class="col-md-6"><label class="form-label">Location</label><input id="location" class="form-control"></div>
<div class="col-md-6"><label class="form-label">Job Type</label><select id="jobType" class="form-select"><option>Full Time</option><option>Part Time</option><option>Internship</option><option>Contract</option><option>Remote</option></select></div>
<div class="col-md-6"><label class="form-label">Status</label><select id="status" class="form-select"><option>Applied</option><option>Interview</option><option>Rejected</option><option>Offer</option><option>Withdrawn</option></select></div>
<div class="col-md-6"><label class="form-label">Applied Date</label><input id="appliedDate" type="date" class="form-control"></div>
<div class="col-md-6"><label class="form-label">Job URL</label><input id="jobUrl" type="url" class="form-control"></div>
<div class="col-md-6"><label class="form-label">Salary</label><input id="salary" class="form-control"></div>
<div class="col-12"><label class="form-label">Notes</label><textarea id="notes" class="form-control" rows="5"></textarea></div>
</div><div class="mt-4"><button class="btn btn-primary" type="submit">Update Application</button><a href="dashboard.html" class="btn btn-outline-secondary ms-2">Cancel</a></div>
</form></div></div></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/edit-application.js"></script>
</body>
</html>
