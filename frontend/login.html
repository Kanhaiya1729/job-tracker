<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - JobTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
<div class="container py-4"><a class="navbar-brand fw-bold text-primary" href="index.html">JobTrack</a></div>
<div class="container"><div class="row justify-content-center"><div class="col-md-6 col-lg-5">
<div class="card auth-card shadow-sm border-0">
  <div class="card-body p-4 p-md-5">
    <h2 class="fw-bold">Welcome back</h2><p class="text-secondary">Login to manage your applications.</p>
    <div id="alertBox"></div>
    <form id="loginForm" novalidate>
      <div class="mb-3"><label class="form-label">Email</label><input id="email" type="email" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Password</label><input id="password" type="password" class="form-control" required minlength="6"></div>
      <button class="btn btn-primary w-100" type="submit">Login</button>
    </form>
    <p class="text-center mt-4 mb-0">Don't have an account? <a href="signup.html">Sign up</a></p>
  </div>
</div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="js/login.js"></script>
</body>
</html>
