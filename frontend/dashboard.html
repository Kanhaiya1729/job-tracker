<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - JobTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg bg-white border-bottom">
<div class="container">
<a class="navbar-brand fw-bold text-primary" href="dashboard.html">JobTrack</a>
<div class="d-flex align-items-center gap-2"><span id="welcomeUser" class="text-secondary d-none d-md-inline"></span><button id="logoutBtn" class="btn btn-outline-danger btn-sm">Logout</button></div>
</div></nav>
<main class="container py-4">
<div class="d-flex justify-content-between align-items-center mb-4"><div><h2 class="fw-bold mb-1">Dashboard</h2><p class="text-secondary mb-0">Manage your job search.</p></div><a href="add-application.html" class="btn btn-primary">+ Add Application</a></div>
<div id="alertBox"></div>
<div class="row g-3 mb-4">
  <div class="col-6 col-lg"><div class="stat-card"><small>Total</small><h3 id="totalCount">0</h3></div></div>
  <div class="col-6 col-lg"><div class="stat-card"><small>Applied</small><h3 id="appliedCount">0</h3></div></div>
  <div class="col-6 col-lg"><div class="stat-card"><small>Interview</small><h3 id="interviewCount">0</h3></div></div>
  <div class="col-6 col-lg"><div class="stat-card"><small>Rejected</small><h3 id="rejectedCount">0</h3></div></div>
  <div class="col-12 col-lg"><div class="stat-card"><small>Offers</small><h3 id="offerCount">0</h3></div></div>
</div>
<div class="card border-0 shadow-sm">
<div class="card-body">
<div class="row g-2 mb-3">
<div class="col-md-7"><input id="searchInput" class="form-control" placeholder="Search company or position..."></div>
<div class="col-md-5"><select id="statusFilter" class="form-select"><option value="">All statuses</option><option>Applied</option><option>Interview</option><option>Rejected</option><option>Offer</option><option>Withdrawn</option></select></div>
</div>
<div class="table-responsive"><table class="table align-middle"><thead><tr><th>Company</th><th>Position</th><th>Location</th><th>Status</th><th>Applied Date</th><th>Actions</th></tr></thead><tbody id="applicationTable"></tbody></table></div>
<div id="emptyState" class="text-center py-5 d-none"><h5>No applications found</h5><p class="text-secondary">Add your first job application.</p><a href="add-application.html" class="btn btn-primary">Add Application</a></div>
</div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
